# 5433: host 5432 is already taken. Redis is ephemeral; replay rebuilds feeds.
# Caps fit a 5 GB Colima VM (Redis 2.8/2.5 GB noeviction, Postgres 1.4 GB).
services:
  postgres:
    image: postgres:16
    mem_limit: 1400m
    memswap_limit: 1400m
    environment:
      POSTGRES_USER: feedline
      POSTGRES_PASSWORD: feedline
      POSTGRES_DB: feedline
    ports:
      - "5433:5432"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - synchronous_commit=off
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_wal_size=1GB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedline -d feedline"]
      interval: 2s
      timeout: 5s
      retries: 40
    shm_size: 256mb
  redis:
    image: redis:7
    mem_limit: 2800m
    memswap_limit: 2800m
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 2500mb
      - --maxmemory-policy
      - noeviction
      - --zset-max-listpack-entries
      - "1024"
      - --zset-max-listpack-value
      - "64"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 40
volumes:
  pgdata:
